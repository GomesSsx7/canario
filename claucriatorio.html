<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Organize seu criatório de canários: controle do plantel, reprodução, ninhadas, saúde, anilhas, despesas e registros em um só lugar.">
<meta name="theme-color" content="#FBF7EF">
<meta name="robots" content="noindex,nofollow">
<title>Plantel | Gestão de criatório de canários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17251C; --ink-2:#3B4B40; --ink-3:#6E7D72;
  --surface:#FBF7EF; --panel:#FFFFFF; --panel-2:#F4EFE3;
  --line:#DCD4C2; --line-soft:#EBE4D5;
  --canary:#EDA900; --canary-soft:#FFF3D1;
  --moss:#3E6B4F; --moss-soft:#E3EEE5;
  --brick:#A8412B; --brick-soft:#F8E5DF;
  --macho:#35566E; --femea:#8A4A6B;
  --r:12px;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --ink:#F0EBDF; --ink-2:#C6C1B4; --ink-3:#929085;
  --surface:#141A16; --panel:#1C2420; --panel-2:#242D28;
  --line:#343E37; --line-soft:#2B342E;
  --canary:#F4BE2E; --canary-soft:#3B3011;
  --moss:#80B190; --moss-soft:#1F2E24;
  --brick:#DF8C77; --brick-soft:#33221D;
  --macho:#90B5CF; --femea:#CF9BB5;
}}
:root[data-theme="dark"]{
  --ink:#F0EBDF; --ink-2:#C6C1B4; --ink-3:#929085;
  --surface:#141A16; --panel:#1C2420; --panel-2:#242D28;
  --line:#343E37; --line-soft:#2B342E;
  --canary:#F4BE2E; --canary-soft:#3B3011;
  --moss:#80B190; --moss-soft:#1F2E24;
  --brick:#DF8C77; --brick-soft:#33221D;
  --macho:#90B5CF; --femea:#CF9BB5;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:Archivo,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--canary);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* navegação por teclado */
.skip-link{position:absolute;top:-80px;left:12px;z-index:120;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px}
.skip-link:focus{top:8px}
/* topo */
header.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{flex:none;width:28px;height:28px;border-radius:50% 50% 50% 4px;background:var(--canary);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;right:5px;top:8px;width:4px;height:4px;border-radius:50%;background:#17251C}
.mark.has-logo::after{display:none}
.mark img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.brand h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;
  color:var(--ink-3);font-weight:600;font-size:14.5px;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--ink);background:var(--panel-2)}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--canary)}

main{max-width:960px;margin:0 auto;padding:22px 18px 80px}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:26px}
.head p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px;max-width:58ch}

/* botões */
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:9px;cursor:pointer;
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-canary{background:var(--canary);border-color:var(--canary);color:#17251C}
.btn-canary:hover{filter:brightness(.95);background:var(--canary)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn-ghost{border-color:transparent;background:none;color:var(--ink-3)}
.btn-ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn-danger{color:var(--brick)}
.btn-danger:hover{background:var(--brick-soft)}
.acts{display:flex;gap:7px;flex-wrap:wrap}

/* peças */
.anilha{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:var(--panel);font-size:12.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.anilha i{width:9px;background:var(--band,#999);border-right:1px solid rgba(0,0,0,.15)}
.anilha b{padding:2px 9px 2px 7px}
.sx{font-weight:700}.sx-M{color:var(--macho)}.sx-F{color:var(--femea)}.sx-I{color:var(--ink-3)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.t-moss{background:var(--moss-soft);color:var(--moss);border-color:var(--moss)}
.t-canary{background:var(--canary-soft);color:#8A6300;border-color:var(--canary)}
.t-brick{background:var(--brick-soft);color:var(--brick);border-color:var(--brick)}
.t-mute{background:var(--panel-2);color:var(--ink-3);border-color:var(--line)}
:root[data-theme="dark"] .t-canary{color:var(--canary)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-canary{color:var(--canary)}}
.muted{color:var(--ink-3)}.small{font-size:13px}
.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}

/* faixa temporada */
.season{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:16px 18px;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.season h3{color:var(--surface);font-size:19px}
.season p{margin:3px 0 0;font-size:13px;color:#BCC7BE;max-width:42ch}
.snum{display:flex;gap:22px;flex-wrap:wrap}
.snum b{display:block;font-family:Fraunces;font-size:24px;color:var(--canary);line-height:1}
.snum span{font-size:11.5px;color:#BCC7BE}

/* stats */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat b{display:block;font-family:Fraunces;font-size:27px;line-height:1}
.stat span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:4px}

/* busca e filtros */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search],.bar input[type=text]{flex:1;min-width:180px;border:1px solid var(--line);
  background:var(--panel);padding:9px 12px;border-radius:9px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:20px;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3)}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* lista de aves */
.itens{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item.on{border-color:var(--canary)}
.item>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover{background:var(--panel-2)}
.item .who{flex:1;min-width:150px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.item .who em{font-style:normal;font-weight:600}
.thumb{flex:none;width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line)}
.thumb-lg{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);flex:none}
.thumb-ph{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;text-align:center}
.up{display:flex;gap:12px;align-items:center}
.up .ubtns{display:flex;gap:7px;flex-wrap:wrap}
.up input[type=file]{max-width:0;max-height:0;opacity:0;position:absolute}
.det{padding:4px 14px 14px;border-top:1px solid var(--line-soft);animation:open .18s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kv div span{display:block;font-size:12px;color:var(--ink-3)}
.kv div b{font-weight:600;font-size:14px}
.mini{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini:last-child{border-bottom:0}
.blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:12px 0}
.bloco h4{margin:0 0 4px;font-size:12.5px;color:var(--ink-3);font-weight:700;font-family:Archivo}

/* ninhada / progresso */
.ninho{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.ninho.alerta{border-color:var(--canary)}
.nh{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.nh strong{font-size:14.5px}
.track{margin:11px 0 8px;height:8px;background:var(--panel-2);border-radius:6px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--canary);border-radius:6px;transition:width .5s ease}
.track i.verde{background:var(--moss)}
.tlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}

/* agenda */
.ag{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.ag:last-child{border-bottom:0}
.ag .dt{flex:none;width:46px;text-align:center}
.ag .dt b{display:block;font-family:Fraunces;font-size:18px;line-height:1}
.ag .dt span{font-size:11px;color:var(--ink-3)}
.ag .tx{flex:1;min-width:0}
.ag .tx strong{font-size:14px}
.ag .tx p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}

/* vazio */
.empty{text-align:center;padding:44px 20px;border:1px dashed var(--line);border-radius:var(--r);background:var(--panel)}
.empty h3{font-size:18px;margin-bottom:5px}
.empty p{color:var(--ink-3);margin:0 auto 14px;max-width:42ch;font-size:14px}

/* tabela simples */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font-size:12.5px;color:var(--ink-3);padding:9px 12px;background:var(--panel-2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:14px}
tr:last-child td{border-bottom:0}
td.num{text-align:right}td.act{text-align:right;width:1%;white-space:nowrap}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;padding:20px;overflow-y:auto;z-index:60}
.ovl[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:600px;margin:auto;
  animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{padding:18px 20px 0;font-size:19px}
.modal>p{margin:5px 20px 0;font-size:13px;color:var(--ink-3)}
.fields{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line-soft)}
.f{display:flex;flex-direction:column;gap:4px;grid-column:1/-1}
.f.half{grid-column:auto}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);padding:9px 11px;border-radius:9px;width:100%}
.f textarea{min-height:62px;resize:vertical}
.f.check{flex-direction:row;align-items:center}.f.check input{width:auto;margin-right:8px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:10px 18px;border-radius:24px;font-weight:600;font-size:14px;z-index:90;box-shadow:0 6px 22px rgba(0,0,0,.22)}
#toast[hidden]{display:none}

@media (max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .f.half{grid-column:1/-1}
  .head h2{font-size:22px}
  main{padding:18px 14px 70px}
  .top-in{padding:10px 14px 0}
}
@media print{header.top,.bar,.acts,.act,.chips{display:none!important}}
</style>
</head>
<body>
<a href="#view" class="skip-link">Pular para o conteúdo</a>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="mark"></div><h1 id="bName">Plantel</h1>
      <button class="btn btn-sm btn-ghost" id="themeBtn" title="Alternar tema" aria-label="Alternar tema claro e escuro" type="button">◐</button></div>
    <nav id="nav" aria-label="Navegação principal"></nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div class="ovl" id="ovl" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT" aria-describedby="mS">
  <h3 id="mT"></h3><p id="mS"></p><div class="fields" id="mF"></div>
  <footer><button class="btn" id="mC">Cancelar</button><button class="btn btn-primary" id="mOk">Salvar</button></footer>
</div></div>
<div id="toast" hidden role="status" aria-live="polite" aria-atomic="true"></div>

<script>
"use strict";
/* ───────── utilidades ───────── */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const n=document.createElement(t);
  for(const p in a){ if(p==="class")n.className=a[p]; else if(p==="html")n.innerHTML=a[p];
    else if(p.startsWith("on"))n.addEventListener(p.slice(2),a[p]); else if(a[p]!=null&&a[p]!==false)n.setAttribute(p,a[p]); }
  k.flat().forEach(c=>c!=null&&c!==false&&n.append(c.nodeType?c:document.createTextNode(c))); return n;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dateLocal=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const hoje=()=>dateLocal(new Date());
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function D(v){if(!v)return null;const p=String(v).slice(0,10).split("-");const x=new Date(+p[0],+p[1]-1,+p[2]);return !Number.isFinite(x.getTime())||x.getFullYear()!==+p[0]||x.getMonth()!==+p[1]-1||x.getDate()!==+p[2]?null:x;}
function fmt(v){const x=D(v);return x?`${String(x.getDate()).padStart(2,"0")}/${String(x.getMonth()+1).padStart(2,"0")}/${x.getFullYear()}`:"—";}
function mais(v,n){const x=D(v);if(!x)return null;x.setDate(x.getDate()+n);return dateLocal(x);}
function dias(a,b){const x=D(a),y=D(b);return x&&y?Math.round((y-x)/864e5):null;}
function R$(n){return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function idade(n){const t=dias(n,hoje());if(t==null)return "—";if(t<60)return t+" dias";const m=Math.floor(t/30.44);return m<24?m+" meses":Math.floor(m/12)+" anos";}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._);toast._=setTimeout(()=>t.hidden=true,2400);}
function foto(file,max){return new Promise((res,rej)=>{
  if(!file||!file.type||!file.type.startsWith("image/")){rej(new Error("tipo"));return;}
  const img=new Image(),rd=new FileReader();
  rd.onerror=()=>rej(new Error("leitura"));
  rd.onload=()=>{img.onerror=()=>rej(new Error("imagem"));
    img.onload=()=>{const esc2=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*esc2)),h=Math.max(1,Math.round(img.height*esc2));
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg",0.82));};
    img.src=rd.result;};
  rd.readAsDataURL(file);});}
function pergunta(t,fn){if(confirm(t))fn();}
const PX="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#ccc"/></svg>');
const CICLO=[{n:"Azul",c:"#2B6CB0"},{n:"Preto",c:"#1F1F1F"},{n:"Verde",c:"#2F7D4F"},{n:"Laranja",c:"#D97A18"},{n:"Vermelho",c:"#B32424"}];
const corAno=a=>CICLO[(((+a||2021)-2021)%5+5)%5];

/* ───────── dados ───────── */
const KEY="criatorio.v1";
const zero=()=>({config:{nome:"Meu criatório",registro:"",especie:"Canário belga"},
  aves:[],casais:[],ninhadas:[],saude:[],lancamentos:[],anilhas:[]});
let S=zero();
function carregar(){try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);if(j&&typeof j==="object"&&["aves","casais","ninhadas","saude","lancamentos","anilhas"].every(k=>Array.isArray(j[k])))S={...zero(),...j,config:{...zero().config,...j.config}};else console.warn("Dados locais incompatíveis; nenhum registro foi substituído.");}}catch(e){console.warn(e);}}
function gravar(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Não deu para salvar aqui. Exporte um backup.");}}
function ok(m){gravar();pintar();if(m)toast(m);}

const ave=id=>S.aves.find(a=>a.id===id);
const plantel=()=>S.aves.filter(a=>a.status==="plantel");
const nome=id=>{const a=ave(id);return a?(a.anilha||a.nome||"sem anilha"):"—";};
const rot=id=>{const a=ave(id);return a?`${a.anilha||"s/ anilha"}${a.nome?" · "+a.nome:""}`:"—";};
const casal=id=>S.casais.find(c=>c.id===id);
const rotCasal=id=>{const c=casal(id);return c?`${nome(c.macho)} × ${nome(c.femea)}`:"—";};
const abertas=()=>S.ninhadas.filter(n=>!n.encerrada);

function chip(a){ if(!a)return el("span",{class:"muted small"},"sem anilha");
  return el("span",{class:"anilha",style:`--band:${corAno(a.anilhaAno).c}`},el("i"),el("b",{},a.anilha||"—")); }
const sexo=s=>el("span",{class:"sx sx-"+(s||"I"),title:{M:"Macho",F:"Fêmea"}[s]||"Sexo indefinido"},{M:"♂",F:"♀"}[s]||"?");
function sit(s){const m={plantel:["t-moss","No plantel"],vendido:["t-mute","Vendido"],obito:["t-brick","Óbito"],
  emprestado:["t-canary","Emprestado"],doado:["t-mute","Doado"],fugiu:["t-brick","Fugiu"]};
  const[c,t]=m[s]||["t-mute",s||"—"];return el("span",{class:"tag "+c},t);}

/* ───────── formulário ───────── */
let okFn=null, fotoVals={};
function form(titulo,sub,campos,vals,salvar){
  $("#mT").textContent=titulo; $("#mS").textContent=sub||""; $("#mS").style.display=sub?"":"none";
  const box=$("#mF"); box.innerHTML=""; fotoVals={};
  campos.forEach(f=>{
    if(f.tipo==="check"){const w=el("div",{class:"f check"});const i=el("input",{type:"checkbox",id:"c_"+f.k});
      i.checked=!!vals[f.k];w.append(i,el("label",{for:"c_"+f.k},f.label));box.append(w);return;}
    if(f.tipo==="foto"){
      fotoVals[f.k]=vals[f.k]||null;

function cardNinhada(n){
  const w=el("div",{class:"ninho"});
  let etapa,pct,txtE,txtD,verde=false,alerta=false;
  if(!n.eclosao){
    const dc=dias(n.postura,hoje());
    etapa="Choco"; pct=Math.min(Math.max(dc/14*100,2),100);
    txtE="dia "+Math.max(dc,0)+" de 14"; txtD="eclosão prevista "+fmt(mais(n.postura,14));
    alerta=dc>=12;
  } else if(!n.anilhados){
    const dv=dias(n.eclosao,hoje());
    etapa="Anilhar"; pct=Math.min(Math.max(dv/6*100,2),100);
    txtE="filhotes com "+Math.max(dv,0)+" dias"; txtD="anilhar até "+fmt(mais(n.eclosao,7));
    alerta=dv>=4;
  } else {
    const dv=dias(n.eclosao,hoje());
    etapa="Criação"; pct=Math.min(Math.max(dv/30*100,2),100); verde=true;
    txtE="filhotes com "+Math.max(dv,0)+" dias"; txtD="desmame por volta de "+fmt(mais(n.eclosao,30));
  }
  if(n.encerrada){etapa="Encerrada";pct=100;verde=true;alerta=false;txtD="ninhada finalizada";}
  if(alerta)w.className="ninho alerta";

    lancamentos:[{id:uid(),tipo:"despesa",data:mais(hoje(),-30),valor:184.9,descricao:"20 kg de mistura",categoria:"Ração e sementes",contato:"Agropecuária"},

/* ───────── tema ───────── */
function tema(){try{return localStorage.getItem(KEY+".tema")||"auto";}catch(e){return "auto";}}
function aplicar(){const t=tema();t==="auto"?document.documentElement.removeAttribute("data-theme")
  :document.documentElement.setAttribute("data-theme",t);}
$("#themeBtn").onclick=()=>{const o=["auto","light","dark"],t=o[(o.indexOf(tema())+1)%3];
  try{localStorage.setItem(KEY+".tema",t);}catch(e){}aplicar();toast("Tema "+({auto:"automático",light:"claro",dark:"escuro"})[t]);};

/* ───────── render ───────── */
const TELAS={painel:vPainel,plantel:vPlantel,reproducao:vRepro,caderno:vCaderno,ajustes:vAjustes};
function pintar(){
  menu();
  $("#bName").textContent=S.config.nome||"Plantel";
  const mk=$(".mark");
  if(S.config.logo){mk.classList.add("has-logo");mk.innerHTML="";mk.append(el("img",{src:S.config.logo,alt:""}));}
  else{mk.classList.remove("has-logo");mk.innerHTML="";}
  const v=$("#view");v.innerHTML="";v.append(TELAS[aba]());
}
carregar();aplicar();pintar();
</script>
